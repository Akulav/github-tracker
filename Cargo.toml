[package]
name = "akulav-tracker"
version = "1.1.1"
edition = "2021"
authors = ["Akulav"]
description = "Akulav Tracker - see every GitHub repository you own at a glance, made by Akulav"
repository = "https://github.com/Akulav/github-tracker"
homepage = "https://akulav.com"
license-file = "LICENSE"
build = "build.rs"

[[bin]]
name = "AkulavTracker"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.32"
egui-phosphor = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[target."cfg(windows)".dependencies]
winreg = "0.56"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
